<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerador de Cronograma de Aulas</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      body {
        font-family: Arial, sans-serif;
        margin: 0;
        background: linear-gradient(135deg, #0f172a, #1d4ed8);
        color: #f8fafc;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .card {
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: 24px;
        width: min(100%, 780px);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
      }

      .header {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 20px;
      }

      .header img {
        width: 120px;
        height: auto;
        border-radius: 12px;
        background: #fff;
        padding: 8px;
      }

      .header-content h1 {
        margin: 0 0 8px;
      }

      .header-content p {
        margin: 0;
        color: #cbd5e1;
      }

      .grid {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        margin-top: 20px;
      }

      label {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-weight: 600;
      }

      input[type="date"],
      input[type="number"],
      input[type="text"],
      select {
        padding: 10px 12px;
        border: 1px solid #475569;
        border-radius: 10px;
        font-size: 1rem;
        background: #111827;
        color: #fff;
      }

      input[readonly] {
        opacity: 0.9;
      }

      .days {
        grid-column: 1 / -1;
      }

      .holiday-picker {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 6px;
      }

      .holiday-controls {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .holiday-controls button {
        padding: 6px 10px;
        min-width: 36px;
        background: #1e293b;
        color: #fff;
      }

      .holiday-grid {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 6px;
      }

      .holiday-day {
        padding: 10px 0;
        min-height: 44px;
        border: 1px solid #475569;
        border-radius: 8px;
        background: #111827;
        color: #fff;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        line-height: 1.2;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        -webkit-appearance: none;
        appearance: none;
        user-select: none;
      }

      .holiday-day.active {
        background: #38bdf8;
        color: #082f49;
        border-color: #38bdf8;
      }

      .holiday-summary {
        font-size: 0.9rem;
        color: #cbd5e1;
      }

      .day-options {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 8px;
      }

      .day-options label,
      .teacher-grid .teacher-field {
        flex-direction: row;
        align-items: center;
        gap: 6px;
        background: #1e293b;
        padding: 8px 10px;
        border-radius: 999px;
        font-weight: 500;
      }

      .teacher-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(180px, 1fr));
        gap: 12px;
        margin-top: 8px;
      }

      .teacher-grid .teacher-field {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
        padding: 10px 12px;
        border-radius: 12px;
        min-width: 0;
      }

      .teacher-grid .teacher-field span {
        font-size: 0.95rem;
        color: #e2e8f0;
      }

      .teacher-grid .teacher-field input {
        width: 100%;
        min-height: 44px;
        padding: 10px 12px;
        border: 1px solid #475569;
        border-radius: 10px;
        background: #111827;
        color: #fff;
        box-sizing: border-box;
      }

      button {
        padding: 12px 16px;
        border: none;
        border-radius: 10px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        background: #38bdf8;
        color: #082f49;
      }

      .actions {
        grid-column: 1 / -1;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      .actions button.secondary {
        background: #e2e8f0;
        color: #0f172a;
      }

      footer {
        margin-top: 24px;
        text-align: center;
        font-size: 0.95rem;
        color: #cbd5e1;
      }

      .result {
        margin-top: 24px;
        padding-top: 16px;
        border-top: 1px solid rgba(255, 255, 255, 0.15);
      }

      .summary {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 14px;
      }

      .pill {
        background: #1e293b;
        padding: 8px 12px;
        border-radius: 999px;
        font-size: 0.95rem;
      }

      table.uc-table,
      table.schedule-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 12px;
        background: #0b1220;
        color: #fff;
        border-radius: 8px;
        overflow: hidden;
      }

      table.uc-table th,
      table.uc-table td,
      table.schedule-table th,
      table.schedule-table td {
        padding: 8px 10px;
        border-bottom: 1px solid rgba(255,255,255,0.06);
        text-align: left;
        font-size: 0.95rem;
      }

      table.uc-table thead th,
      table.schedule-table thead th {
        background: rgba(255,255,255,0.03);
        font-weight: 700;
      }

      @media print {
        body { background: #fff; color: #000; }
        header, .header, form, .actions, .day-options, .holiday-picker, .teacher-grid, #ucSection, button, .table-controls { display: none !important; }
        .card { background: #fff; border: none; box-shadow: none; }
        table.uc-table, table.schedule-table { color: #000; background: #fff; }
        tr.page-break { page-break-after: always; }
        thead { display: table-header-group; }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="header">
        <img src="logosenac.png" alt="Logo do Senac" />
        <div class="header-content">
          <h1>Gerador de Cronograma de Aulas</h1>
          <p>Insira as informações necessárias para gerar o cronograma de aulas.</p>
        </div>
      </div>

      <form id="scheduleForm">
        <div class="grid">
          <label>
            Nome do curso
            <input type="text" id="courseName" placeholder="Ex.: Informática" required />
          </label>

          <div id="ucSection">
            <label>Unidades Curriculares (UC)</label>
            <div id="ucList"></div>
            <div style="display:flex;gap:8px;margin-top:8px;">
              <button type="button" id="addUc">Adicionar UC</button>
              <button type="button" id="removeUc" class="secondary">Remover última UC</button>
            </div>

            <label>
              Carga horária do curso
              <input type="text" id="courseLoad" readonly placeholder="Total das UCs será calculado" required />
            </label>
          </div>

          <label>
            Duração da aula
            <input type="text" id="classDuration" placeholder="Informe a duração da aula 3h30 (ex.: 3,5) " required />
          </label>

          <label>
            Período
            <select id="period" required>
              <option value="">Selecione</option>
              <option value="Manhã">Manhã</option>
              <option value="Tarde">Tarde</option>
              <option value="Noite">Noite</option>
            </select>
          </label>

          <label>
            Data da primeira aula
            <input type="date" id="startDate" required />
          </label>

          <label>
            Quantidade total de aulas do curso
            <input type="number" id="totalClasses" min="1" value="160" required />
          </label>

          <label>
            Último dia de aula do curso
            <input type="text" id="lastClassDate" readonly />
          </label>

          <label>
            Feriados
            <div class="holiday-picker">
              <div class="holiday-controls">
                <button type="button" id="prevMonth">‹</button>
                <strong id="calendarMonthLabel"></strong>
                <button type="button" id="nextMonth">›</button>
              </div>
              <div class="holiday-grid" id="holidaysCalendar"></div>
              <div class="holiday-summary" id="holidaySummary">Nenhum dia selecionado</div>
              <input type="hidden" id="holidays" />
            </div>
          </label>

          <div class="days">
            <label>Dias de aula</label>
            <div class="day-options" id="dayOptions"></div>
          </div>

          <div class="teachers">
            <label>Docentes por dia</label>
            <div class="teacher-grid" id="teacherGrid"></div>
          </div>

          <div class="actions">
            <button type="submit">Gerar cronograma</button>
            <button type="button" class="secondary" id="exportPdf">Salvar em PDF</button>
          </div>
        </div>
      </form>

      <div class="result" id="result"></div>

      <footer>
        Desenvolvido por Rodrigo Gentini<br />
        Versão 1.3
      </footer>
    </div>

    <script>
      const dayNames = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];
      const weekdayMapping = {
        Domingo: 0,
        Segunda: 1,
        Terça: 2,
        Quarta: 3,
        Quinta: 4,
        Sexta: 5,
        Sábado: 6,
      };
      const dayOptions = document.getElementById("dayOptions");
      const form = document.getElementById("scheduleForm");
      const result = document.getElementById("result");
      const exportPdfButton = document.getElementById("exportPdf");
      const totalClassesInput = document.getElementById("totalClasses");
      const courseLoadInput = document.getElementById("courseLoad");
      const classDurationInput = document.getElementById("classDuration");
      const holidaysInput = document.getElementById("holidays");
      const ucList = document.getElementById("ucList");
      const addUcButton = document.getElementById("addUc");
      const removeUcButton = document.getElementById("removeUc");
      const holidaysCalendar = document.getElementById("holidaysCalendar");
      const holidaySummary = document.getElementById("holidaySummary");
      const monthLabel = document.getElementById("calendarMonthLabel");
      const prevMonthButton = document.getElementById("prevMonth");
      const nextMonthButton = document.getElementById("nextMonth");
      const teacherGrid = document.getElementById("teacherGrid");
      let currentHolidayMonth = new Date();
      let selectedHolidayDates = new Set();
      let lastGeneratedSchedule = [];

      // Funções para gerenciar UCs (Unidades Curriculares)
      function createUcRow(index = null, name = "UC", hours = "0") {
        const row = document.createElement("div");
        row.style.display = "flex";
        row.style.gap = "8px";
        row.style.alignItems = "center";
        row.style.marginTop = "8px";

        const nameInput = document.createElement("input");
        nameInput.type = "text";
        nameInput.placeholder = `UC ${index !== null ? index : ""}`;
        nameInput.value = name;
        nameInput.style.flex = "1";

        const hoursInput = document.createElement("input");
        hoursInput.type = "number";
        hoursInput.min = "0";
        hoursInput.step = "0.5";
        hoursInput.value = hours;
        hoursInput.style.width = "140px";

        hoursInput.addEventListener("input", () => {
          recalcUCTotal();
        });

        row.appendChild(nameInput);
        row.appendChild(hoursInput);
        return row;
      }

      function recalcUCTotal() {
        if (!ucList) return;
        const inputs = ucList.querySelectorAll("input[type='number']");
        let total = 0;
        inputs.forEach((inp) => {
          const v = parseFloat(inp.value);
          if (!Number.isNaN(v)) total += v;
        });
        courseLoadInput.value = total > 0 ? String(total) : "";
        syncTotalClasses();
      }

      function addUc(name = "UC", hours = "0") {
        if (!ucList) return;
        const index = ucList.children.length + 1;
        const row = createUcRow(index, name, hours);
        ucList.appendChild(row);
        recalcUCTotal();
      }

      function removeLastUc() {
        if (!ucList) return;
        if (ucList.lastElementChild) {
          ucList.removeChild(ucList.lastElementChild);
          recalcUCTotal();
        }
      }

      if (addUcButton) addUcButton.addEventListener('click', () => addUc(`UC${ucList.children.length + 1}`, '0'));
      if (removeUcButton) removeUcButton.addEventListener('click', () => removeLastUc());

      // Inicializar com ao menos uma UC
      if (ucList && ucList.children.length === 0) {
        addUc('UC1', '48');
      }

      const weekdayLabels = ["Domingo", "Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado"];

      const weekdays = Object.keys(weekdayMapping);
      weekdays.forEach((day) => {
        const label = document.createElement("label");
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.value = weekdayMapping[day];
        checkbox.id = `day-${day}`;
        
        label.appendChild(checkbox);
        label.appendChild(document.createTextNode(day));
        dayOptions.appendChild(label);
      });

      weekdayLabels.forEach((day, index) => {
        const field = document.createElement("div");
        field.className = "teacher-field";

        const label = document.createElement("span");
        label.textContent = day;

        const input = document.createElement("input");
        input.type = "text";
        input.id = `teacher-${index}`;
        input.placeholder = `Docente para ${day}`;

        field.appendChild(label);
        field.appendChild(input);
        teacherGrid.appendChild(field);
      });

      function getTeacherNames() {
        return weekdayLabels.reduce((acc, _, index) => {
          const teacher = document.getElementById(`teacher-${index}`).value.trim();
          acc[index] = teacher;
          return acc;
        }, []);
      }

      function getUCs() {
        if (!ucList) return [];
        return Array.from(ucList.children).map((row) => {
          const inputs = row.querySelectorAll("input");
          const name = inputs[0] ? inputs[0].value.trim() : "";
          const hours = inputs[1] ? parseFloat(inputs[1].value) || 0 : 0;
          return { name, hours };
        });
      }

      function formatDate(date) {
        return new Intl.DateTimeFormat("pt-BR", {
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
        }).format(date);
      }

      function getSelectedDays() {
        return Array.from(dayOptions.querySelectorAll("input[type='checkbox']:checked")).map((el) => Number(el.value));
      }

      function formatDateKey(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      function parseHolidays(value) {
        if (!value) return [];

        return value
          .split(",")
          .map((item) => item.trim())
          .filter(Boolean)
          .map((item) => {
            const date = new Date(`${item}T00:00:00`);
            return Number.isNaN(date.getTime()) ? null : formatDateKey(date);
          })
          .filter(Boolean);
      }

      function renderHolidayCalendar() {
        const year = currentHolidayMonth.getFullYear();
        const month = currentHolidayMonth.getMonth();
        monthLabel.textContent = currentHolidayMonth.toLocaleDateString("pt-BR", {
          month: "long",
          year: "numeric",
        });

        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);
        const daysInMonth = lastDay.getDate();
        const startWeekday = firstDay.getDay();

        const cells = [];
        for (let i = 0; i < startWeekday; i += 1) {
          cells.push('<div></div>');
        }

        for (let day = 1; day <= daysInMonth; day += 1) {
          const date = new Date(year, month, day);
          const key = formatDateKey(date);
          const isActive = selectedHolidayDates.has(key);
          cells.push(`<button type="button" class="holiday-day${isActive ? " active" : ""}" data-date="${key}">${day}</button>`);
        }

        holidaysCalendar.innerHTML = cells.join("");
        holidaySummary.textContent = selectedHolidayDates.size
          ? `Selecionados: ${Array.from(selectedHolidayDates).sort().join(", ")}`
          : "Nenhum dia selecionado";
        holidaysInput.value = Array.from(selectedHolidayDates).sort().join(",");

        // Delegação de eventos: adiciona listener uma vez para o container
        if (!holidaysCalendar._listenerAdded) {
          holidaysCalendar.addEventListener("click", (event) => {
            const btn = event.target.closest && event.target.closest('.holiday-day');
            if (btn && btn.dataset && btn.dataset.date) {
              event.preventDefault();
              toggleHoliday(btn.dataset.date);
            }
          });

          holidaysCalendar.addEventListener("touchend", (event) => {
            const btn = event.target.closest && event.target.closest('.holiday-day');
            if (btn && btn.dataset && btn.dataset.date) {
              event.preventDefault();
              toggleHoliday(btn.dataset.date);
            }
          }, { passive: false });

          holidaysCalendar._listenerAdded = true;
        }
      }

      function toggleHoliday(dateKey) {
        if (selectedHolidayDates.has(dateKey)) {
          selectedHolidayDates.delete(dateKey);
        } else {
          selectedHolidayDates.add(dateKey);
        }

        // Atualiza campo e renderiza
        holidaysInput.value = Array.from(selectedHolidayDates).sort().join(",");
        renderHolidayCalendar();
      }

      function initSelectedHolidaysFromInput() {
        const parsed = parseHolidays(holidaysInput.value);
        selectedHolidayDates = new Set(parsed);
      }

      function buildSchedule(startDate, requiredCount, selectedDays) {
        if (selectedDays.length === 0) {
          throw new Error("Selecione pelo menos um dia de aula.");
        }

        const schedule = [];
        const current = new Date(startDate);
        const holidays = parseHolidays(holidaysInput.value);
        current.setHours(0, 0, 0, 0);

        while (schedule.length < requiredCount) {
          const dateKey = formatDateKey(current);
          const isHoliday = holidays.includes(dateKey);

          if (!isHoliday && selectedDays.includes(current.getDay())) {
            schedule.push(new Date(current));
          }
          current.setDate(current.getDate() + 1);
        }

        return schedule;
      }

      // Build schedule respecting individual UCs hours and class duration
      function buildScheduleForUCs(startDate, ucs, classDurationHours, selectedDays) {
        if (!Array.isArray(ucs) || ucs.length === 0) {
          throw new Error("Adicione pelo menos uma UC com horas.");
        }

        if (selectedDays.length === 0) {
          throw new Error("Selecione pelo menos um dia de aula.");
        }

        if (!classDurationHours || classDurationHours <= 0) {
          throw new Error("Informe a duração da aula válida.");
        }

        const holidays = parseHolidays(holidaysInput.value);
        const schedule = [];
        const current = new Date(startDate);
        current.setHours(0, 0, 0, 0);

        // For each UC, compute number of classes needed and schedule them sequentially
        for (let ucIndex = 0; ucIndex < ucs.length; ucIndex += 1) {
          const uc = ucs[ucIndex];
          const totalHours = Number(uc.hours) || 0;
          const classesNeeded = Math.max(0, Math.ceil(totalHours / classDurationHours));

          let scheduledForThisUc = 0;
          while (scheduledForThisUc < classesNeeded) {
            const key = formatDateKey(current);
            const isHoliday = holidays.includes(key);

            if (!isHoliday && selectedDays.includes(current.getDay())) {
              const remainingHours = totalHours - scheduledForThisUc * classDurationHours;
              const classHour = Math.min(classDurationHours, Math.max(0, remainingHours));

              schedule.push({
                date: new Date(current),
                ucIndex: ucIndex,
                ucName: uc.name || `UC ${ucIndex + 1}`,
                classNumberInUc: scheduledForThisUc + 1,
                classesNeeded: classesNeeded,
                classHour: classHour,
              });

              scheduledForThisUc += 1;
            }

            current.setDate(current.getDate() + 1);
          }
        }

        return schedule;
      }

      function parseDurationToHours(value) {
        if (!value) return null;

        const normalized = value.toString().trim().toLowerCase().replace(/,/g, ".");
        const hoursMatch = normalized.match(/(\d+(?:\.\d+)?)\s*(h|hr|hrs|hora|horas)/);
        const minutesMatch = normalized.match(/(\d+(?:\.\d+)?)\s*(m|min|mins|minute|minutes)/);

        if (hoursMatch || minutesMatch) {
          const hours = hoursMatch ? Number(hoursMatch[1]) : 0;
          const minutes = minutesMatch ? Number(minutesMatch[1]) : 0;
          return hours + minutes / 60;
        }

        const plainNumber = Number(normalized);
        return Number.isFinite(plainNumber) ? plainNumber : null;
      }

      function parseCourseLoadToHours(value) {
        if (!value) return null;

        const normalized = value.toString().trim().toLowerCase().replace(/,/g, ".");
        const match = normalized.match(/(\d+(?:\.\d+)?)\s*(h|hr|hrs|hora|horas)?/);

        if (!match) return null;

        const number = Number(match[1]);
        return Number.isFinite(number) ? number : null;
      }

      function calculateTotalClasses() {
        const courseLoadHours = parseCourseLoadToHours(courseLoadInput.value);
        const classDurationHours = parseDurationToHours(classDurationInput.value);

        if (courseLoadHours === null || classDurationHours === null || classDurationHours <= 0) {
          return null;
        }

        const total = Math.ceil(courseLoadHours / classDurationHours);
        return total > 0 ? total : null;
      }

      function syncTotalClasses() {
        const total = calculateTotalClasses();
        if (total === null) {
          return;
        }

        totalClassesInput.value = total;
      }

      function renderSchedule(event) {
        event.preventDefault();

        const courseName = document.getElementById("courseName").value.trim();
        const period = document.getElementById("period").value;
        const startDateInput = document.getElementById("startDate").value;
        const totalClasses = Number(document.getElementById("totalClasses").value);
        const selectedDays = getSelectedDays();
        const holidaysInputValue = holidaysInput.value;
        const teacherNames = getTeacherNames();
        const ucs = getUCs();

        if (!courseName || !period) {
          result.innerHTML = "<p>Informe o nome do curso e o período.</p>";
          return;
        }

        if (!startDateInput) {
          result.innerHTML = "<p>Informe a data da primeira aula.</p>";
          return;
        }

        if (!totalClasses || totalClasses < 1) {
          result.innerHTML = "<p>Informe a quantidade total de aulas do curso.</p>";
          return;
        }

          try {
          // recalcula total de aulas com base nas UCs individuais
          const ucs = getUCs();
          const classDurationHours = parseDurationToHours(classDurationInput.value);

          if (!classDurationHours) {
            throw new Error("Informe a duração da aula válida.");
          }

          const startDate = new Date(`${startDateInput}T00:00:00`);
          const schedule = buildScheduleForUCs(startDate, ucs, classDurationHours, selectedDays);

          const futureClasses = schedule;
          lastGeneratedSchedule = futureClasses.slice();
          const nextClass = futureClasses[0] ? futureClasses[0].date : null;
          const lastClass = futureClasses.length ? futureClasses[futureClasses.length - 1].date : null;

          // Atualiza total de aulas no formulário
          totalClassesInput.value = futureClasses.length || 0;
          document.getElementById("lastClassDate").value = lastClass ? formatDate(lastClass) : "";

          // resumo por UC em tabela
          const ucSummariesTable = `
            <table class="uc-table">
              <thead><tr><th>UC</th><th>Horas</th><th>Aulas</th></tr></thead>
              <tbody>
                ${ucs
                  .map((u, idx) => {
                    const classesForUc = futureClasses.filter((it) => it.ucIndex === idx).length;
                    return `<tr><td>${u.name || `UC ${idx + 1}`}</td><td>${u.hours}</td><td>${classesForUc}</td></tr>`;
                  })
                  .join("")}
              </tbody>
            </table>`;

          result.innerHTML = `
            <div class="summary">
              <span class="pill">Curso: ${courseName}</span>
              <span class="pill">Carga horária total: ${document.getElementById("courseLoad").value || "—"}</span>
              <span class="pill">Duração da aula: ${document.getElementById("classDuration").value || "—"}</span>
              <span class="pill">Período: ${period}</span>
              <span class="pill">Total de aulas: ${futureClasses.length}</span>
              <span class="pill">Próxima aula: ${nextClass ? formatDate(nextClass) : "—"}</span>
              <span class="pill">Último dia do curso: ${lastClass ? formatDate(lastClass) : "—"}</span>
              <span class="pill">Feriados: ${holidaysInputValue || "Nenhum"}</span>
            </div>

            <div class="summary">${ucSummariesTable}</div>

            <div class="table-controls" style="display:flex;gap:8px;align-items:center;margin-top:12px;">
              <label style="font-weight:700;color:#cbd5e1;">Linhas por página:</label>
              <select id="pageSizeSelect">
                <option value="10">10</option>
                <option value="20">20</option>
                <option value="40">40</option>
                <option value="100">100</option>
              </select>
              <button type="button" id="prevPage">Anterior</button>
              <button type="button" id="nextPage">Próxima</button>
              <span id="pageIndicator" style="margin-left:8px;color:#cbd5e1;"></span>
            </div>

            <table class="schedule-table" id="scheduleTable">
              <thead>
                <tr>
                  <th>#</th>
                  <th>Data</th>
                  <th>Dia</th>
                  <th>Docente</th>
                  <th>UC</th>
                  <th>Aula (x/y)</th>
                  <th>Duração (h)</th>
                </tr>
              </thead>
              <tbody id="scheduleTbody">
              </tbody>
            </table>
          `;

          // Paginação
          (function setupPagination() {
            const pageSizeSelect = document.getElementById('pageSizeSelect');
            const prevBtn = document.getElementById('prevPage');
            const nextBtn = document.getElementById('nextPage');
            const pageIndicator = document.getElementById('pageIndicator');
            const tbody = document.getElementById('scheduleTbody');

            let pageSize = Number(pageSizeSelect.value) || 10;
            let currentPage = 1;

            function renderPage() {
              const start = (currentPage - 1) * pageSize;
              const end = Math.min(start + pageSize, futureClasses.length);
              const rows = futureClasses.slice(start, end).map((entry, idx) => {
                const index = start + idx;
                const teacher = teacherNames[entry.date.getDay()] || "—";
                const isPageBreak = ((index + 1) % pageSize) === 0;
                return `<tr class="${isPageBreak ? 'page-break' : ''}"><td>${index + 1}</td><td>${formatDate(entry.date)}</td><td>${dayNames[entry.date.getDay()]}</td><td>${teacher}</td><td>${entry.ucName}</td><td>${entry.classNumberInUc}/${entry.classesNeeded}</td><td>${entry.classHour}</td></tr>`;
              }).join('');
              tbody.innerHTML = rows;
              pageIndicator.textContent = `Página ${currentPage} / ${Math.max(1, Math.ceil(futureClasses.length / pageSize))}`;
              prevBtn.disabled = currentPage <= 1;
              nextBtn.disabled = currentPage >= Math.ceil(futureClasses.length / pageSize);
            }

            pageSizeSelect.addEventListener('change', () => {
              pageSize = Number(pageSizeSelect.value) || 10;
              currentPage = 1;
              renderPage();
            });

            prevBtn.addEventListener('click', () => {
              if (currentPage > 1) {
                currentPage -= 1;
                renderPage();
              }
            });

            nextBtn.addEventListener('click', () => {
              if (currentPage < Math.ceil(futureClasses.length / pageSize)) {
                currentPage += 1;
                renderPage();
              }
            });

            renderPage();
          })();
        } catch (error) {
          document.getElementById("lastClassDate").value = "";
          result.innerHTML = `<p>${error.message}</p>`;
        }
      }

      form.addEventListener("submit", renderSchedule);
      courseLoadInput.addEventListener("input", syncTotalClasses);
      classDurationInput.addEventListener("input", syncTotalClasses);


      prevMonthButton.addEventListener("click", () => {
        currentHolidayMonth = new Date(currentHolidayMonth.getFullYear(), currentHolidayMonth.getMonth() - 1, 1);
        renderHolidayCalendar();
      });

      nextMonthButton.addEventListener("click", () => {
        currentHolidayMonth = new Date(currentHolidayMonth.getFullYear(), currentHolidayMonth.getMonth() + 1, 1);
        renderHolidayCalendar();
      });

      exportPdfButton.addEventListener("click", async () => {
        if (!Array.isArray(lastGeneratedSchedule) || lastGeneratedSchedule.length === 0) {
          alert('Gere o cronograma antes de exportar para PDF.');
          return;
        }

        async function loadHtml2Pdf() {
          if (window.html2pdf) return window.html2pdf;
          return new Promise((resolve, reject) => {
            const s = document.createElement('script');
            s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.min.js';
            s.onload = () => resolve(window.html2pdf);
            s.onerror = reject;
            document.head.appendChild(s);
          });
        }

        // Esconde temporariamente os badges de resumo (class="pill")
        // e as tabelas de resumo/cronograma para evitar duplicações no PDF.
        const _pillEls = Array.from(document.querySelectorAll('.pill'));
        const _pillPrev = _pillEls.map(e => e.style.display || '');
        _pillEls.forEach(e => e.style.display = 'none');

        const _tableEls = Array.from(document.querySelectorAll('.summary table, #scheduleTable'));
        const _tablePrev = _tableEls.map(e => e.style.display || '');
        _tableEls.forEach(e => e.style.display = 'none');

        // Oculta o rodapé da página (marca HTML) para não aparecer no PDF (já adicionamos rodapé no container)
        const _pageFooter = document.querySelector('footer');
        const _pageFooterPrev = _pageFooter ? (_pageFooter.style.display || '') : null;
        if (_pageFooter) _pageFooter.style.display = 'none';

        try {
          const html2pdf = await loadHtml2Pdf();

          // Criar container limpo para PDF (um único cabeçalho + data + tabelas)
          const container = document.createElement('div');
          container.style.maxWidth = '900px';
          container.style.margin = '0 auto';
          container.style.background = '#fff';
          container.style.color = '#000';
          container.style.padding = '16px';
          container.style.boxSizing = 'border-box';

          // Cabeçalho com logo e título (layout para A4 retrato)
          const now = new Date();
          const header = document.createElement('div');
          header.style.display = 'flex';
          header.style.alignItems = 'center';
          header.style.justifyContent = 'flex-start';
          header.style.gap = '16px';
          header.style.marginBottom = '12px';

          const logo = document.createElement('img');
          logo.src = 'logosenac.png';
          logo.alt = '';
          logo.style.width = '96px';
          logo.style.height = 'auto';
          logo.style.objectFit = 'contain';

          const titleWrap = document.createElement('div');
          const h1 = document.createElement('h1');
          h1.textContent = (document.getElementById('courseName').value || '').toUpperCase();
          h1.style.margin = '0';
          h1.style.fontSize = '18px';
          h1.style.letterSpacing = '0.4px';
          h1.style.fontFamily = 'Arial, Helvetica, sans-serif';

          const gen = document.createElement('div');
          gen.textContent = `Gerado em: ${formatDate(now)} ${now.toLocaleTimeString()}`;
          gen.style.marginTop = '6px';
          gen.style.fontSize = '12px';
          gen.style.color = '#333';

          titleWrap.appendChild(h1);
          titleWrap.appendChild(gen);

          header.appendChild(logo);
          header.appendChild(titleWrap);
          container.appendChild(header);

          // UC summary table
          const ucs = getUCs();

          // Deduplicar entradas do cronograma por (data, ucIndex, classNumberInUc)
          const seen = new Set();
          const scheduleForPdf = lastGeneratedSchedule.filter((entry) => {
            const key = `${formatDate(entry.date)}|${entry.ucIndex}|${entry.classNumberInUc}`;
            if (seen.has(key)) return false;
            seen.add(key);
            return true;
          });

          const ucTable = document.createElement('table');
          ucTable.style.width = '100%';
          ucTable.style.borderCollapse = 'collapse';
          ucTable.innerHTML = `<thead><tr><th style="text-align:left;padding:6px;border-bottom:1px solid #ccc;">UC</th><th style="text-align:left;padding:6px;border-bottom:1px solid #ccc;">Horas</th><th style="text-align:left;padding:6px;border-bottom:1px solid #ccc;">Aulas</th></tr></thead><tbody>${ucs.map((u, idx) => { const classesForUc = scheduleForPdf.filter(it => it.ucIndex === idx).length; return `<tr><td style="padding:6px;border-bottom:1px solid #eee;">${u.name || `UC ${idx+1}`}</td><td style="padding:6px;border-bottom:1px solid #eee;">${u.hours}</td><td style="padding:6px;border-bottom:1px solid #eee;">${classesForUc}</td></tr>`; }).join('')}</tbody>`;
          container.appendChild(ucTable);

          // Espaço
          container.appendChild(document.createElement('hr'));

          // Schedule table (todas as aulas)
          const scheduleTable = document.createElement('table');
          scheduleTable.style.width = '100%';
          scheduleTable.style.borderCollapse = 'collapse';
          scheduleTable.innerHTML = `<thead><tr><th style="padding:6px;border-bottom:1px solid #ccc;">#</th><th style="padding:6px;border-bottom:1px solid #ccc;">Data</th><th style="padding:6px;border-bottom:1px solid #ccc;">Dia</th><th style="padding:6px;border-bottom:1px solid #ccc;">Docente</th><th style="padding:6px;border-bottom:1px solid #ccc;">UC</th><th style="padding:6px;border-bottom:1px solid #ccc;">Aula</th><th style="padding:6px;border-bottom:1px solid #ccc;">Duração (h)</th></tr></thead><tbody>` + scheduleForPdf.map((entry, index) => { const teacher = getTeacherNames()[entry.date.getDay()] || '—'; return `<tr><td style="padding:6px;border-bottom:1px solid #eee;">${index+1}</td><td style="padding:6px;border-bottom:1px solid #eee;">${formatDate(entry.date)}</td><td style="padding:6px;border-bottom:1px solid #eee;">${dayNames[entry.date.getDay()]}</td><td style="padding:6px;border-bottom:1px solid #eee;">${teacher}</td><td style="padding:6px;border-bottom:1px solid #eee;">${entry.ucName}</td><td style="padding:6px;border-bottom:1px solid #eee;">${entry.classNumberInUc}/${entry.classesNeeded}</td><td style="padding:6px;border-bottom:1px solid #eee;">${entry.classHour}</td></tr>`; }).join('') + '</tbody>';
          container.appendChild(scheduleTable);

          // Rodapé do PDF: Desenvolvido por e versão
          const footer = document.createElement('div');
          footer.style.marginTop = '20px';
          footer.style.fontSize = '11px';
          footer.style.color = '#666';
          footer.style.display = 'flex';
          footer.style.justifyContent = 'space-between';
          footer.style.alignItems = 'center';
          const left = document.createElement('div');
          left.textContent = 'Desenvolvido por Rodrigo Gentini';
          const right = document.createElement('div');
          right.textContent = 'Versão 1.3';
          footer.appendChild(left);
          footer.appendChild(right);
          container.appendChild(footer);

          document.body.appendChild(container);

          // filename
          const courseVal = (document.getElementById('courseName').value || 'cronograma').trim();
          const safeCourse = courseVal.replace(/[^a-zA-Z0-9\-\_]/g, '_');
          const pad = (n) => String(n).padStart(2, '0');
          const ts = `${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
          const filename = `${safeCourse}_${ts}.pdf`;

          const opt = {
            margin:       10,
            filename:     filename,
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, logging: false, useCORS: true },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
          };

          await html2pdf().set(opt).from(container).save();
          document.body.removeChild(container);
        } catch (err) {
          console.warn('html2pdf falhou, usando print fallback', err);
          window.print();
        } finally {
          // Restaura exibição original dos badges e tabelas
          _pillEls.forEach((e, i) => { e.style.display = _pillPrev[i] || ''; });
          _tableEls.forEach((e, i) => { e.style.display = _tablePrev[i] || ''; });
          if (_pageFooter) _pageFooter.style.display = _pageFooterPrev || '';
        }
      });

      document.getElementById("startDate").value = new Date().toISOString().split("T")[0];
      initSelectedHolidaysFromInput();
      renderHolidayCalendar();
      renderSchedule({ preventDefault() {} });
    </script>
  </body>
</html>
